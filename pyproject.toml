[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-memory-bench"
version = "0.1.0"
description = "A benchmark for governed shared memory in a fleet of agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fmb = "bench.cli:main"

[project.urls]
Homepage = "https://github.com/oren198/memory-governance-bench"

[tool.setuptools.packages.find]
include = ["bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
